      --bg-cream: #FAF7F2;
      --card-bg: #FFFFFF;
      --text-dark: #332219;
      --text-muted: #7A6B63;
      --border-color: #E5DDD5;
      --input-bg: #FDFCFB;
      --shadow-color: rgba(141, 91, 76, 0.15);
      --shadow-deep: rgba(51, 34, 25, 0.25);

      --point-yellow: #FFC800;
      --point-yellow-hover: #E6B400;
      --point-yellow-soft: #FFF4C2;
      --point-yellow-border: #FFD633;

      --badge-sale-text: #2E7D32;
      --badge-reserved-bg: #FFF3E0;
      --badge-reserved-text: #E65100;
      --badge-completed-bg: #ECEFF1;
      --badge-completed-text: #546E7A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* Page Header */
    header {
      width: 100%;
      max-width: 680px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-brown);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-tag {
      font-size: 0.85rem;
      background: var(--bg-cream);
      color: var(--primary-brown);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      border: 1px solid var(--border-color);
    }

    /* Main Container & Product Grid */
    .container {
      width: 100%;
      max-width: 680px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .section-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 12px var(--shadow-color);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px var(--shadow-color);
    }

    .card-thumb-wrap {
      width: 100%;
      height: 200px;
      position: relative;
      background-color: #F0ECE9;
      overflow: hidden;
    }

    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .card-thumb {
      transform: scale(1.05);
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-header-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .card-price {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-brown);
    }

    /* Status Badges */
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .status-badge.sale {
      background-color: var(--badge-sale-bg);
      color: var(--badge-sale-text);
    }

    .status-badge.reserved {
      background-color: var(--badge-reserved-bg);
      color: var(--badge-reserved-text);
    }

    .status-badge.completed {
      background-color: var(--badge-completed-bg);
      color: var(--badge-completed-text);
    }

    /* ========================================================
       [?붾㈃ 2] ?곸꽭 紐⑤떖 (#detailModal) ?ㅽ???       ======================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(51, 34, 25, 0.55);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 520px;
      height: 90vh;
      max-height: 820px;
      border-radius: 24px;
      box-shadow: 0 16px 40px var(--shadow-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transform: translateY(20px) scale(0.97);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-container {
      transform: translateY(0) scale(1);
    }

    /* Top Half: Product Image Area */
    .modal-image-area {
      position: relative;
      width: 100%;
      height: 340px;
      min-height: 280px;
      background-color: #F5F1ED;
      flex-shrink: 0;
      overflow: hidden;
    }

    .modal-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    /* Overlay Controls on Image */
    .btn-close-modal {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.4);
      color: #FFFFFF;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: background-color 0.2s ease, transform 0.2s ease;
      z-index: 10;
    }

    .btn-close-modal:hover {
      background: rgba(0, 0, 0, 0.65);
      transform: rotate(90deg);
    }

    /* Image Pagination Dots */
    .image-pagination {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .page-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease;
    }

    .page-dot.active {
      background: #FFFFFF;
      width: 16px;
      border-radius: 4px;
    }

    /* Bottom Content Area (Scrollable) */
    .modal-content-area {

      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;

    /* Custom Scrollbar */
    .modal-content-area::-webkit-scrollbar {
      width: 6px;
    }
    .modal-content-area::-webkit-scrollbar-thumb {
      background: #D9D2CB;
      border-radius: 3px;

      white-space: pre-wrap;
      word-break: break-word;

      color: var(--text-muted);
      display: flex;
      gap: 12px;
      padding-top: 12px;
    }

    /* Bottom Button Area (Fixed Footer in Modal) */
    .modal-footer {
      padding: 14px 24px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-wishlist {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-wishlist:hover {
      background: var(--bg-cream);
      border-color: var(--accent-brown);
    }

    .btn-wishlist svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 2;
      transition: all 0.2s ease;

    .btn-wishlist.active {
      border-color: #FF6B6B;
      background: #FFF5F5;
    }

    .btn-wishlist.active svg {
      fill: #FF6B6B;
      stroke: #FF6B6B;
    }

    .btn-chat {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      border: none;
      background-color: var(--point-yellow);
      color: var(--text-on-yellow);
      font-size: 1.05rem;
      font-weight: 800;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(255, 200, 0, 0.4);
      transition: all 0.2s ease;

    .btn-chat:hover {
      background-color: var(--point-yellow-hover);
      color: var(--text-on-yellow);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255, 200, 0, 0.5);

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(51, 34, 25, 0.9);

      z-index: 2000;

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);

    let currentProduct = null;

    // Render Product Cards in Grid
    function renderProductGrid() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = sampleProducts.map(p => `
        <div class="product-card" onclick="openDetailModalById(${p.id})">
          <div class="card-thumb-wrap">
            <img class="card-thumb" src="${p.image}" alt="${p.title}" loading="lazy">
          </div>
          <div class="card-body">
            <div class="card-header-line">
              <span class="card-category">${p.category}</span>
              <span class="status-badge ${p.status}">${p.statusText}</span>
            </div>
            <h3 class="card-title">${p.title}</h3>
            <div class="card-meta">${p.location} ??${p.uploadTime}</div>
            <div class="card-footer">
              <span class="card-price">${p.price.toLocaleString()}??/span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openDetailModalById(id) {
      const product = sampleProducts.find(p => p.id === id);
      if (product) {
        openDetailModal(product);
      }
    }

    /**
     * openDetailModal(product)
     * @param {Object} product - ?곹뭹 ?뺣낫 媛앹껜
     */
    function openDetailModal(product) {
      currentProduct = product;

      // Populate Top Image
      document.getElementById('modalImage').src = product.image;
      document.getElementById('modalImage').alt = product.title;

      // Populate Seller Info
      document.getElementById('modalSellerAvatar').src = product.seller.avatar;
      document.getElementById('modalSellerName').textContent = product.seller.name;
      document.getElementById('modalSellerLocation').textContent = product.seller.location;
      document.getElementById('modalMannerTemp').textContent = product.seller.mannerTemp;

      // Populate Status & Category
      const badge = document.getElementById('modalStatusBadge');
      badge.className = `status-badge ${product.status}`;
      badge.textContent = product.statusText;

      document.getElementById('modalCategory').textContent = product.category;

      // Title (Uppercase / Bold)
      document.getElementById('modalTitle').textContent = product.title;

      // Meta (Location, Upload Time, Price)
      document.getElementById('modalLocation').textContent = product.location;
      document.getElementById('modalUploadTime').textContent = product.uploadTime;
      document.getElementById('modalPrice').textContent = `${product.price.toLocaleString()}??;

      // Description (multiline text)
      document.getElementById('modalDescription').textContent = product.description;

      // Engagement Stats
      document.getElementById('modalWishCount').textContent = product.wishCount;
      document.getElementById('modalChatCount').textContent = product.chatCount;
      document.getElementById('modalViewCount').textContent = product.viewCount;

      // Wishlist Heart state
      const wishBtn = document.getElementById('modalWishBtn');
      if (product.isWished) {
        wishBtn.classList.add('active');
      } else {
        wishBtn.classList.remove('active');
      }

      // Show Modal Overlay
      const modal = document.getElementById('detailModal');
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Lock background scroll
    }

    /**
     * closeDetailModal()
     */
    function closeDetailModal() {
      const modal = document.getElementById('detailModal');
      modal.classList.remove('active');
      document.body.style.overflow = ''; // Unlock background scroll
    }

    // Overlay click handling (close when background clicked)
    function handleOverlayClick(event) {
      if (event.target === document.getElementById('detailModal')) {
        closeDetailModal();
      }
    }

    // ESC key close
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeDetailModal();
      }
    });

    // Wishlist Toggle
    function toggleWishlist() {
      if (!currentProduct) return;

      currentProduct.isWished = !currentProduct.isWished;
      const wishBtn = document.getElementById('modalWishBtn');

      if (currentProduct.isWished) {
        currentProduct.wishCount += 1;
        wishBtn.classList.add('active');
        showToast("?ㅿ툘 愿??紐⑸줉??異붽??섏뿀?듬땲??");
      } else {
        currentProduct.wishCount = Math.max(0, currentProduct.wishCount - 1);
        wishBtn.classList.remove('active');
        showToast("愿??紐⑸줉?먯꽌 ??젣?섏뿀?듬땲??");
      }

      document.getElementById('modalWishCount').textContent = currentProduct.wishCount;
    }

    }

    // Toast Function
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
