      visibility: hidden;

    // DOM Elements
    const writeModal = document.getElementById('writeModal');
    const writeForm = document.getElementById('writeForm');
    const imagePreview = document.getElementById('imagePreview');
    const previewPlaceholder = document.getElementById('previewPlaceholder');
    const btnRemoveImage = document.getElementById('btnRemoveImage');
    const productImageUrl = document.getElementById('productImageUrl');
    const productImageFile = document.getElementById('productImageFile');
    const productGrid = document.getElementById('productGrid');

    let currentImageDataUrl = "";

    // 1. Render Product List
    function renderProducts() {
      productGrid.innerHTML = "";
      if (products.length === 0) {
        productGrid.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">?깅줉???곹뭹???놁뒿?덈떎.</div>`;
        return;
      }

      products.forEach(product => {
        let badgeClass = "sale";
        if (product.status === "?덉빟以?) badgeClass = "reserved";
        if (product.status === "嫄곕옒?꾨즺") badgeClass = "completed";

        const formattedPrice = Number(product.price).toLocaleString('ko-KR');

        const cardHTML = `
          <div class="product-card">
            <img src="${product.image || DEFAULT_IMAGE}" alt="${product.title}" onerror="this.src='${DEFAULT_IMAGE}'">
            <div class="product-info">
              <div>
                <div class="product-title">${escapeHTML(product.title)}</div>
                <div class="product-meta">
                  <span class="status-badge ${badgeClass}">${product.status}</span>
                  <span>??/span>
                  <span>${escapeHTML(product.category)}</span>
                  <span>??/span>
                  <span>${escapeHTML(product.location)}</span>
                  <span>??/span>
                  <span>${product.time}</span>
                </div>
              </div>
              <div class="product-price">${formattedPrice} ??/div>
            </div>
          </div>
        `;
        productGrid.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    // 2. Open / Close Modal Functions
    function openWriteModal() {
      resetForm();
      writeModal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Lock scrolling
    }

    function closeWriteModal() {
      writeModal.classList.remove('active');
      document.body.style.overflow = '';
      resetForm();
    }

    function handleOverlayClick(event) {
      if (event.target === writeModal) {
        closeWriteModal();
      }
    }

    // 3. Image Input Handling
    function handleUrlImageInput(url) {
      if (url.trim()) {
        currentImageDataUrl = url.trim();
        showPreview(currentImageDataUrl);
      } else {
        clearImagePreview();
      }
    }

    function handleFileImageInput(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentImageDataUrl = e.target.result;
          productImageUrl.value = ""; // URL ?낅젰李?珥덇린??          showPreview(currentImageDataUrl);
        };
        reader.readAsDataURL(file);
      }
    }

    function showPreview(src) {
      imagePreview.src = src;
      imagePreview.style.display = 'block';
      previewPlaceholder.style.display = 'none';
      btnRemoveImage.style.display = 'flex';
    }

    function clearImagePreview() {
      currentImageDataUrl = "";
      productImageUrl.value = "";
      productImageFile.value = "";
      imagePreview.src = "";
      imagePreview.style.display = 'none';
      previewPlaceholder.style.display = 'flex';
      btnRemoveImage.style.display = 'none';
    }

    // 4. Form Reset & Validation
    function resetForm() {
      writeForm.reset();
      clearImagePreview();
      hideErrors();
      const countEl = document.getElementById('productDescCharCount');
      if (countEl) countEl.textContent = '0';
    }

    function hideErrors() {
      document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
    }

    function validateForm() {
      hideErrors();
      let isValid = true;

      const title = document.getElementById('productTitle').value.trim();
      const category = document.getElementById('productCategory').value;
      const price = document.getElementById('productPrice').value.trim();
      const location = document.getElementById('productLocation').value.trim();

      if (!title) {
        document.getElementById('titleError').style.display = 'block';
        isValid = false;
      }
      if (!category) {
        document.getElementById('categoryError').style.display = 'block';
        isValid = false;
      }
      if (!price || isNaN(price) || Number(price) < 0) {
        document.getElementById('priceError').style.display = 'block';
        isValid = false;
      }
      if (!location) {
        document.getElementById('locationError').style.display = 'block';
        isValid = false;
      }

      return isValid;
    }

    // 5. addNewProduct() - Core Function Required
    function addNewProduct(newProductData) {
      const newProduct = {
        id: Date.now(), // Auto ID generation
        title: newProductData.title,
        category: newProductData.category,
        price: Number(newProductData.price),
        location: newProductData.location,
        status: newProductData.status || "?먮ℓ以?,
        image: newProductData.image || DEFAULT_IMAGE,
        description: newProductData.description || "",
        time: "諛⑷툑 ?? // '諛⑷툑 ?? 吏??      };

      // Add to beginning of array
      products.unshift(newProduct);

      // Refresh product list UI
      renderProducts();

      // Close modal
      closeWriteModal();
    }

    // 6. Form Submission Handler
    function handleFormSubmit(event) {
      event.preventDefault();

      if (!validateForm()) {
        return;
      }

      const statusRadio = document.querySelector('input[name="productStatus"]:checked');
      
      const formData = {
        title: document.getElementById('productTitle').value.trim(),
        category: document.getElementById('productCategory').value,
        price: document.getElementById('productPrice').value.trim(),
        location: document.getElementById('productLocation').value.trim(),
        status: statusRadio ? statusRadio.value : "?먮ℓ以?,
        image: currentImageDataUrl || DEFAULT_IMAGE,
        description: document.getElementById('productDescription').value.trim()
      };

      addNewProduct(formData);
    }

    // Helper: HTML Escaping
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Initial render on load
    document.addEventListener('DOMContentLoaded', () => {
      renderProducts();

      const descInput = document.getElementById('productDescription');
      const countEl = document.getElementById('productDescCharCount');
      if (descInput && countEl) {
        descInput.addEventListener('input', () => {
          if (descInput.value.length > 500) {
            descInput.value = descInput.value.slice(0, 500);
          }
          countEl.textContent = descInput.value.length;
        });
      }
    });
  </script>
</body>
</html>
